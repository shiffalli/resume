name: Daily Job Agent

on:
  schedule:
    - cron: '0 12 * * *' # Runs everyday at 12:00 PM UTC (8:00 AM EST)
  workflow_dispatch: # Allows manual trigger

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "resume/main.py" ]; then
            python resume/main.py
          else
            find . -name "main.py" -exec python {} \;
          fi
